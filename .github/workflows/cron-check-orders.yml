name: Verificar Pedidos Automáticamente

on:
  schedule:
    # Ejecutar cada 5 minutos (GitHub Actions mínimo es 5 min)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Permitir ejecutar manualmente desde GitHub

jobs:
  check-orders:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3
      
      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Instalar dependencias
        run: npm install
      
      - name: Ejecutar verificación de pedidos
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
          DHRU_URL: ${{ secrets.DHRU_URL }}
          DHRU_USERNAME: ${{ secrets.DHRU_USERNAME }}
          DHRU_API_KEY: ${{ secrets.DHRU_API_KEY }}
        run: node cron-jobs/check-orders.js